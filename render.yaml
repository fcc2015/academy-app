services:
  - type: web
    name: academy-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # ── Core Supabase ─────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # ── Security ─────────────────────────────────────────────
      - key: ENCRYPTION_KEY
        sync: false
      - key: DEV_MODE
        value: "false"
      - key: FRONTEND_URL
        value: "https://academy-app-mu.vercel.app"
      # ── PayPal ───────────────────────────────────────────────
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX
        value: "true"
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # ── Lemon Squeezy ─────────────────────────────────────────
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_SIGNING_SECRET
        sync: false
      # ── Web Push (VAPID) ──────────────────────────────────────
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        value: "mailto:admin@academy.com"
      # ── WhatsApp ─────────────────────────────────────────────
      - key: WHATSAPP_PROVIDER
        value: "mock"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: META_WHATSAPP_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_API_VERSION
        value: "v19.0"
      # ── Email (SMTP) ──────────────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # ── Email (Resend — alternative) ──────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      # ── Stripe ───────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ── Sentry ───────────────────────────────────────────────
      - key: SENTRY_DSN
        sync: false
